
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Behaviour Monitoring System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4f46e5,#06b6d4);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:750px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#222;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#333;
}

input, select, textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:14px;
}

textarea{
    resize:vertical;
    min-height:120px;
}

.file-box{
    margin-top:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:20px;
    transition:0.3s;
}

button:hover{
    background:#3730a3;
}

.result{
    margin-top:25px;
    padding:20px;
    border-radius:12px;
    background:#f3f4f6;
    border-left:6px solid #4f46e5;
}

.result h3{
    margin-bottom:10px;
}

.loading{
    color:#2563eb;
    font-weight:bold;
}

.error{
    color:red;
    font-weight:bold;
}

.success{
    color:green;
    font-weight:bold;
}

.footer{
    margin-top:20px;
    text-align:center;
    font-size:12px;
    color:#777;
}
</style>
</head>

<body>

<div class="container">
    <h1>Student Behaviour Monitoring</h1>
    <p class="subtitle">Classes 1 to 12 - AI Behaviour Analysis System</p>

    <div class="grid">
        <div>
            <label>Student Name</label>
            <input type="text" id="studentName" placeholder="Enter student name">
        </div>

        <div>
            <label>Class</label>
            <select id="studentClass">
                <option value="">Select Class</option>
            </select>
        </div>
    </div>

    <div style="margin-top:15px;">
        <label>Behaviour Description</label>
        <textarea id="description" placeholder="Example: Student was disturbing other students during class..."></textarea>
    </div>

    <div class="file-box">
        <label>Upload Evidence Image (Optional)</label>
        <input type="file" id="imageUpload" accept="image/*">
    </div>

    <button onclick="submitData()">Analyze Behaviour</button>

    <div class="result" id="resultBox">
        <h3>Prediction Result</h3>
        <p>No prediction yet.</p>
    </div>

    <div class="footer">
        Replace API_URL with your deployed backend endpoint.
    </div>
</div>

<script>
// Populate class dropdown
const classDropdown = document.getElementById("studentClass");

for(let i=1;i<=12;i++){
    const option = document.createElement("option");
    option.value = i;
    option.textContent = "Class " + i;
    classDropdown.appendChild(option);
}

async function submitData(){

    const studentName = document.getElementById("studentName").value;
    const studentClass = document.getElementById("studentClass").value;
    const description = document.getElementById("description").value;
    const imageFile = document.getElementById("imageUpload").files[0];
    const resultBox = document.getElementById("resultBox");

    const API_URL = "API_URL/predict";

    resultBox.innerHTML = '<p class="loading">Analyzing behaviour...</p>';

    try{

        let response;

        // If image exists → send FormData
        if(imageFile){

            const formData = new FormData();
            formData.append("student_name", studentName);
            formData.append("student_class", studentClass);
            formData.append("description", description);
            formData.append("image", imageFile);

            response = await fetch(API_URL,{
                method:"POST",
                body:formData
            });

        } else {

            // JSON request
            response = await fetch(API_URL,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    student_name: studentName,
                    student_class: studentClass,
                    description: description
                })
            });
        }

        if(!response.ok){
            throw new Error("Server returned " + response.status);
        }

        const data = await response.json();

        resultBox.innerHTML = `
            <h3>Prediction Result</h3>
            <p class="success"><strong>Status:</strong> Success</p>
            <pre style="white-space:pre-wrap; margin-top:10px;">${JSON.stringify(data,null,2)}</pre>
        `;

    } catch(error){

        resultBox.innerHTML = `
            <h3>Prediction Result</h3>
            <p class="error">Error: ${error.message}</p>
        `;
    }
}
</script>

</body>
</html>
